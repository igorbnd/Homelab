apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orca
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/igorbnd/Homelab.git
    targetRevision: main
    path: kubernetes/orca-k3s/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: orca
  syncPolicy:
    # Manual, deliberately -- clustering/persistence is still fresh and has
    # one open caveat (see results/notes.md). Auto-sync would revert manual
    # kubectl debugging mid-session. Revisit once I trust it more.
    syncOptions:
    - CreateNamespace=false
  # No ignoreDifferences for the LB IP -- tried that with
  # RespectIgnoreDifferences=true and it still got wiped on sync (a known,
  # closed-as-not-planned ArgoCD bug for annotations). The LB IP annotation
  # key is now absent from manifests/30-service.yaml entirely instead --
  # ArgoCD has no opinion on a field it never sees.
