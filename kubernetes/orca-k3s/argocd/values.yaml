# Homelab-scale install: no HA, plain HTTP through the existing Traefik ingress.

configs:
  params:
    # No TLS termination here. Without this, the server redirects to HTTPS
    # internally and the plain-HTTP Ingress below loops.
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.orca.lan
