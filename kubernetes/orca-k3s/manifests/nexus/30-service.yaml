apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: nexus
  labels:
    app: nexus
  annotations:
    # Pinned so it doesn't drift across Service recreation. Not wired into
    # containerd -- direct-pull comparison target, not a production candidate.
    # PLACEHOLDER_LB_IP -- rewritten by scripts/nexus/00-deploy.sh from .env
    metallb.universe.tf/loadBalancerIPs: "10.0.0.11"
spec:
  type: LoadBalancer
  selector:
    app: nexus
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: docker-proxy
    port: 8083
    targetPort: 8083
    protocol: TCP
