apiVersion: v1
kind: Service
metadata:
  name: orca
  namespace: orca
  labels:
    app: orca
  # No metallb.universe.tf/loadBalancerIPs annotation here on purpose. It's a
  # real per-environment value I never commit, and ArgoCD's ignoreDifferences
  # + RespectIgnoreDifferences doesn't reliably survive a sync for annotations
  # (learned this the hard way -- see results/notes.md). Keeping the key
  # entirely out of the tracked manifest is the only pattern that actually
  # holds: scripts/02-deploy.sh sets it via `kubectl annotate` as a separate
  # step after applying this file, so ArgoCD never has an opinion on it.
spec:
  type: LoadBalancer
  selector:
    app: orca
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: metrics
    port: 9464
    targetPort: 9464
    protocol: TCP