apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orca
  namespace: orca
  labels:
    app: orca
spec:
  # 2 replicas with Premium clustering: either replica can serve any cached
  # object via the mesh, so this no longer fragments the cache the way plain
  # multi-replica would. See CLAUDE.md "Design decisions".
  #
  # StatefulSet, not Deployment: clustering's static peers list needs stable
  # per-pod network identity, and MSE4 persistence needs each replica to own
  # its own disk-backed store. volumeClaimTemplates below gives orca-0/orca-1
  # each their own PVC.
  serviceName: orca-cluster
  replicas: 2
  selector:
    matchLabels:
      app: orca
  template:
    metadata:
      labels:
        app: orca
      annotations:
        # Picked up by the "kubernetes-pods" scrape job in prometheus-config —
        # that job filters on these three pod annotations specifically.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k3s-master01
                - k3s-node2-nuc
                # k3s-node3-debian excluded: k3s version skew (v1.34.3 agent
                # vs v1.33.6 server) — unsupported combination.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          # Hard requirement: the 2 replicas must never land on the same node,
          # or clustering's resilience story (survive losing one node) is fake.
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - orca
            topologyKey: kubernetes.io/hostname
      containers:
      - name: orca
        image: varnish/orca:latest
        imagePullPolicy: IfNotPresent
        # Colon-separated: Orca deep-merges multiple config files, which is
        # what lets the cluster token live outside the git-tracked ConfigMap.
        args: ["--config", "/app/config.yaml:/app/cluster-secret.yaml"]
        ports:
        - name: http
          containerPort: 80
        - name: metrics
          containerPort: 9464
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: rulesets
          mountPath: /etc/orca-rulesets
          readOnly: true
        - name: orca-license
          mountPath: /etc/orca/
          readOnly: true
        - name: cluster-secret
          mountPath: /app/cluster-secret.yaml
          subPath: cluster-secret.yaml
          readOnly: true
        - name: mse-storage
          mountPath: /var/lib/orca-mse
        resources:
          requests:
            memory: "3Gi"
            cpu: "250m"
          limits:
            # 6Gi: clustering + MSE4 metadata overhead on top of the firewall
            # RSS budget. Check real RSS after deploying, don't just trust this.
            memory: "6Gi"
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: config
        configMap:
          name: orca-config
      - name: rulesets
        configMap:
          name: orca-firewall-rulesets
      - name: orca-license
        secret:
          # scripts/02-deploy.sh creates this idempotently from license.lic
          # if missing -- not git-tracked.
          secretName: orca-license
      - name: cluster-secret
        secret:
          # Not git-tracked, not owned by ArgoCD -- absent from the Kustomize
          # source entirely. Created idempotently by scripts/02-deploy.sh.
          secretName: orca-cluster-token
  volumeClaimTemplates:
  - metadata:
      name: mse-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          # Headroom above the 15G store -- local-path doesn't support online
          # expansion, so I'm generous rather than tight here.
          storage: 22Gi
