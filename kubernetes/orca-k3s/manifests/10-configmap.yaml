apiVersion: v1
kind: ConfigMap
metadata:
  name: orca-config
  namespace: orca
data:
  config.yaml: |
    varnish:
      http:
      - port: 80
      params:
        # 60% of the 6Gi limit = ~3.6Gi RAM cache. Rest is headroom for the
        # firewall and MSE4 metadata. Auto-adjusts to the real cgroup limit
        # at startup regardless of what I write here.
        memory_target: 60%
        workspace_backend: 128k
      storage:
        # 15G on disk, bigger than the RAM cache -- the point of MSE4 is
        # extending the cache past available memory, not just surviving a
        # restart. size must be > book_size + 1G filesystem overhead.
        stores:
        - name: mse-store
          path: /var/lib/orca-mse
          size: 15G
          book_size: 5G

    otel:
      service_name: orca
      metrics:
        enabled: true
        exporter: prometheus
        prometheus_host: 0.0.0.0
        prometheus_port: 9464

    # token deliberately NOT here -- it's in orca-cluster-token (a Secret, not
    # git-tracked, same pattern as orca-license), merged in via the
    # colon-separated --config flag. Orca deep-merges cluster: across files,
    # so this stays safe for ArgoCD to own outright.
    # storage_replicas: 2 = full replication across both peers -- with only 2
    # nodes eligible, this is what makes the resilience demo (kill one pod,
    # other still serves) real.
    cluster:
      storage_replicas: 2
      peers:
      - url: http://orca-0.orca-cluster.orca.svc.cluster.local:80
      - url: http://orca-1.orca-cluster.orca.svc.cluster.local:80

    virtual_registry:
      registries:
      - name: dockerhub
        default: true
        enable_cluster: true
        remotes:
        - url: https://docker.io
        - url: https://mirror.gcr.io
      - name: k8s
        enable_cluster: true
        remotes:
        - url: https://registry.k8s.io
      - name: ghcr
        enable_cluster: true
        remotes:
        - url: https://ghcr.io
      - name: npmjs
        enable_cluster: true
        enable_firewall: true
        remotes:
        - url: https://registry.npmjs.org
    firewall:
      default_action: allow
      mode: normal
      audit_log_output: stdout
      log_level: debug
      rulesets:
      - path: /etc/orca-rulesets
      # Real advisories from OSV (osv.dev), regenerated hourly by Varnish.
      # npm only for now: the file holds hundreds of thousands of rules.
      - git:
          name: osv-npm
          url: https://github.com/varnish/osv-rules.git
          ref: main
          sub_path: rulesets/npm/all.yaml
          interval: 1h
          fetch_timeout: 120s

    license: 
      file: /etc/orca/license.lic 
