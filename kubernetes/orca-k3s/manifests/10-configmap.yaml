apiVersion: v1
kind: ConfigMap
metadata:
  name: orca-config
  namespace: orca
data:
  config.yaml: |
    varnish:
      http:
      - port: 80
      params:
        # 60% of the 6Gi limit = ~3.6Gi RAM cache. The rest is headroom for the
        # firewall (~1.2Gi RSS at 228k OSV rules, measured) and MSE4 metadata.
        # memory_target auto-adjusts to the real cgroup limit at startup regardless
        # of what's written here -- confirmed in results/notes.md 2026-09-24.
        memory_target: 60%
        workspace_backend: 128k
      storage:
        # MSE4 persisted storage (Premium, licensed -- addons: sup-persistence).
        # 15G on disk, bigger than the RAM cache: this is the actual point of MSE4 --
        # extend the cache past available memory, not just survive a restart.
        # size must be > book_size + 1G filesystem overhead -- validated on a
        # throwaway pod first, see results/notes.md 2026-09-24.
        stores:
        - name: mse-store
          path: /var/lib/orca-mse
          size: 15G
          book_size: 5G

    otel:
      service_name: orca
      metrics:
        enabled: true
        exporter: prometheus
        prometheus_host: 0.0.0.0
        prometheus_port: 9464

    # Premium clustering (addons: sup-clustering). token deliberately NOT here --
    # it lives in a separate file, orca-cluster-token/cluster-secret.yaml, sourced
    # from a Secret created out-of-band by scripts/02-deploy.sh (never git-tracked,
    # same pattern as orca-license) and merged in via the colon-separated --config
    # flag on the StatefulSet. Confirmed 2026-09-24 on a throwaway pod that Orca
    # deep-merges the cluster: map across files rather than one replacing the
    # other -- this ConfigMap is safe for GitOps/ArgoCD to own outright; the token
    # Secret isn't managed by ArgoCD at all.
    # peers use the headless Service's stable per-pod DNS names
    # (manifests/25-headless-service.yaml), which only exist because Orca is a
    # StatefulSet, not a Deployment, now. storage_replicas: 2 = full replication
    # across both peers -- with only 2 nodes eligible (node3 excluded, version
    # skew), this is what makes the resilience demo (kill one pod, other still
    # serves cached content) real.
    cluster:
      storage_replicas: 2
      peers:
      - url: http://orca-0.orca-cluster.orca.svc.cluster.local:80
      - url: http://orca-1.orca-cluster.orca.svc.cluster.local:80

    virtual_registry:
      registries:
      - name: dockerhub
        default: true
        enable_cluster: true
        remotes:
        - url: https://docker.io
        - url: https://mirror.gcr.io
      - name: k8s
        enable_cluster: true
        remotes:
        - url: https://registry.k8s.io
      - name: ghcr
        enable_cluster: true
        remotes:
        - url: https://ghcr.io
      - name: npmjs
        enable_cluster: true
        enable_firewall: true
        remotes:
        - url: https://registry.npmjs.org
    firewall:
      default_action: allow
      mode: normal
      audit_log_output: stdout
      log_level: debug
      rulesets:
      - path: /etc/orca-rulesets
      # Real advisories from OSV (osv.dev), regenerated hourly by Varnish.
      # npm only for now: the file holds hundreds of thousands of rules.
      - git:
          name: osv-npm
          url: https://github.com/varnish/osv-rules.git
          ref: main
          sub_path: rulesets/npm/all.yaml
          interval: 1h
          fetch_timeout: 120s

    license: 
      file: /etc/orca/license.lic 
