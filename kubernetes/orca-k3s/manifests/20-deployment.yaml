apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca
  namespace: orca
  labels:
    app: orca
spec:
  # Deliberately 1: free-tier Orca has no clustering, so each replica keeps an
  # independent in-memory cache. More replicas behind a round-robin Service
  # would fragment the cache and refetch the same blobs from origin.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orca
  template:
    metadata:
      labels:
        app: orca
      annotations:
        # Picked up by the "kubernetes-pods" scrape job in prometheus-config —
        # that job filters on these three pod annotations specifically.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k3s-master01
                - k3s-node2-nuc
                # k3s-node3-debian excluded: k3s version skew (v1.34.3 agent
                # vs v1.33.6 server) — unsupported combination.
      containers:
      - name: orca
        image: varnish/orca:latest
        imagePullPolicy: IfNotPresent
        args: ["--config", "/app/config.yaml"]
        ports:
        - name: http
          containerPort: 80
        - name: metrics
          containerPort: 9464
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: rulesets
          mountPath: /etc/orca-rulesets
          readOnly: true
        resources:
          requests:
            memory: "3Gi"
            cpu: "250m"
          limits:
            memory: "5Gi"
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: config
        configMap:
          name: orca-config
      - name: rulesets
        configMap:
          name: orca-firewall-rulesets