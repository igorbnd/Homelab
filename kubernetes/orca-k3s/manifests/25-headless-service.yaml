apiVersion: v1
kind: Service
metadata:
  name: orca-cluster
  namespace: orca
  labels:
    app: orca
spec:
  # Headless (clusterIP: None) -- exists purely to give each StatefulSet pod a
  # stable DNS name (orca-0.orca-cluster.orca.svc.cluster.local, orca-1...) for
  # the static cluster.peers list in manifests/10-configmap.yaml to reference.
  # Not for client traffic -- that's still manifests/30-service.yaml (LoadBalancer).
  clusterIP: None
  selector:
    app: orca
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
