# JFrog's own docs point to this Helm chart as the supported self-hosted install
# path. Not hand-rolled manifests like Orca/Nexus: Artifactory needs a real DB
# and init logic the chart already handles correctly.
#
# License is NOT in this file. scripts/jfrog/00-deploy.sh creates a Secret from a
# local *.lic file (gitignored) and passes --set artifactory.license.secret/dataKey.
#
# Pinned to k3s-master01 (most memory headroom of the two eligible nodes).
# local-path, not Longhorn, so PVCs stay node-local -- throwaway comparison
# data doesn't need replication, and node3's small disk is a bad fit anyway.

global:
  nodeSelector:
    kubernetes.io/hostname: k3s-master01

artifactory:
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2"
  javaOpts:
    xms: "1g"
    xmx: "3g"
  persistence:
    storageClassName: local-path
    size: 20Gi

nginx:
  service:
    type: LoadBalancer
    # LB IP is NOT set here -- scripts/jfrog/00-deploy.sh passes it via
    # --set nginx.service.annotations."metallb\.universe\.tf/loadBalancerIPs"=$JFROG_LB_IP
    # so no real IP ever needs to live in this checked-in file.
  persistence:
    storageClassName: local-path

postgresql:
  primary:
    nodeSelector:
      kubernetes.io/hostname: k3s-master01
    persistence:
      storageClassName: local-path
      # Chart default is 200Gi, meant for production. This is a lab trial.
      size: 20Gi
    resourcesPreset: "small"
