# Kustomize base for ArgoCD (argocd/orca-application.yaml points here).
# Scope: Orca only -- manifests/jfrog/ and manifests/nexus/ stay out, they're
# throwaway comparison rigs deployed via their own scripts instead.
#
# orca-license and orca-cluster-token Secrets are deliberately absent here --
# neither is git-tracked, both are created out-of-band by scripts/02-deploy.sh,
# so ArgoCD never sees them as part of this app.
resources:
- 00-namespace.yaml
- 10-configmap.yaml
- 15-firewall-rulesets.yaml
- 20-statefulset.yaml
- 25-headless-service.yaml
- 30-service.yaml
