apiVersion: v1
kind: ConfigMap
metadata:
  name: orca-firewall-rulesets
  namespace: orca
data:
  lab.yaml: |
    id: homelab-lab-rules
    title: Homelab practice rules
    description: Hands-on rules for practising the Artifact Firewall.
    rules:
    # Stand-in "known-bad" package. left-pad@1.3.0 is harmless, which is the
    # point: if the install is rejected it is because of this rule and nothing
    # else. Older versions (1.2.0 ...) must still install -- that is the control.
    # purl selects the package, version is a separate VERS range (exact pin here).
    - id: LAB-0002
      priority: 100
      action: deny
      reason: "Lab: simulated known-bad package (left-pad 1.3.0)"
      match:
      - purl: "pkg:npm/left-pad"
        version: "vers:npm/1.3.0"
    # Working control: same idea, but a hyphen-free name. Enforced on the tarball
    # request, unlike LAB-0002 above (see results/notes.md: tarball version is
    # mis-parsed for hyphenated package names, so LAB-0002 never blocks a download).
    - id: LAB-0003
      priority: 100
      action: deny
      reason: "Lab: hyphen-free control (ms 2.1.3)"
      match:
      - purl: "pkg:npm/ms"
        version: "vers:npm/2.1.3"
