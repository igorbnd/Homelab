apiVersion: v1
kind: ConfigMap
metadata:
  name: orca-config
  namespace: orca
data:
  config.yaml: |
    varnish:
      http:
      - port: 80
      params:
        # 60% of the 5Gi limit = 3Gi cache, same as before. The rest is headroom for
        # the firewall: ~1.2Gi RSS with 228k OSV npm rules (measured), outside the cache.
        memory_target: 60%
        workspace_backend: 128k

    otel:
      service_name: orca
      metrics:
        enabled: true
        exporter: prometheus
        prometheus_host: 0.0.0.0
        prometheus_port: 9464

    virtual_registry:
      registries:
      - name: dockerhub
        default: true
        remotes:
        - url: https://docker.io
        - url: https://mirror.gcr.io
      - name: k8s
        remotes:
        - url: https://registry.k8s.io
      - name: ghcr
        remotes:
        - url: https://ghcr.io
      - name: npmjs
        enable_firewall: true
        remotes:
        - url: https://registry.npmjs.org
    firewall:
      default_action: allow
      mode: normal
      audit_log_output: stdout
      log_level: debug
      rulesets:
      - path: /etc/orca-rulesets
      # Real advisories from OSV (osv.dev), regenerated hourly by Varnish.
      # npm only for now: the file holds hundreds of thousands of rules.
      - git:
          name: osv-npm
          url: https://github.com/varnish/osv-rules.git
          ref: main
          sub_path: rulesets/npm/all.yaml
          interval: 1h
          fetch_timeout: 120s

    license: 
      file: /etc/orca/license.lic 
